# Llama al workflow de menciones a @claude del plugin fabrica, en la versión
# de este proyecto. Lo escribe fabrica-setup: se actualiza con
# `fabrica-setup refresh`.
#
# Credenciales, como secretos del repo: CLAUDE_TOKEN_<SU_USUARIO> por persona
# y, opcional, ANTHROPIC_API_KEY de equipo.
name: claude-mentions

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  mentions:
    uses: __FABRICA_REPO__/.github/workflows/claude-mentions.yml@__FABRICA_REF__
    with:
      fabrica_repo: __FABRICA_REPO__
      fabrica_ref: __FABRICA_REF__
    secrets: inherit
