# Llama al workflow de PRs en conflicto del plugin fabrica, en la versión de
# este proyecto. Lo escribe fabrica-setup: se actualiza con
# `fabrica-setup refresh`.
name: pr-conflicts

on:
  # Un merge mueve la rama principal y puede hacer chocar a los otros PRs.
  push:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  conflicts:
    uses: __FABRICA_REPO__/.github/workflows/pr-conflicts.yml@__FABRICA_REF__
    with:
      fabrica_repo: __FABRICA_REPO__
      fabrica_ref: __FABRICA_REF__
    secrets:
      FABRICA_PLUGIN_TOKEN: ${{ secrets.FABRICA_PLUGIN_TOKEN }}
