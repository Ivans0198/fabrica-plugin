# Los tests del kit: vigilan las piezas del plugin (hooks, scripts, reglas,
# agentes, skills y workflows). Corren aquí y no en cada proyecto.
name: kit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
