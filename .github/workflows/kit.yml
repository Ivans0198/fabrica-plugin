# Los tests del kit: vigilan las piezas del plugin (hooks, scripts, reglas,
# agentes, skills y workflows). Corren aquí y no en cada proyecto.
name: kit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
