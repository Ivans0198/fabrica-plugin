# Reusable workflow: mencionar @claude en un issue o comentario hace que Claude
# responda desde un runner de GitHub. Sirve para preguntas, tickets sueltos o
# arreglos chicos. La planeación con Spec Kit (spec, plan, tareas, issues) no:
# necesita una sesión interactiva.
#
# Credencial: token personal del actor (CLAUDE_TOKEN_<USUARIO>) o API key de
# equipo, de los secretos que el proyecto pasa con `secrets: inherit`.
# Solo OWNER, MEMBER o COLLABORATOR pueden invocarlo.
name: claude-mentions

on:
  workflow_call:
    inputs:
      fabrica_repo:
        required: true
        type: string
      fabrica_ref:
        required: true
        type: string

jobs:
  claude:
    # Sin este filtro, en un repo público cualquiera abriría un issue con
    # "@claude" y obtendría ejecución con escritura en el repo y gasto de
    # credenciales.
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association || github.event.issue.author_association) &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: claude-mentions-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # Sin la credencial del workflow: checkout v7 la guarda con
      # includeIf.gitdir y claude-code-action no la quita, así que git
      # empujaba con github.token y esos pushes no corren los checks
      # (quedan en action_required). Sin ella, git usa la de la App.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trae el plugin fabrica
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.fabrica_repo }}
          ref: ${{ inputs.fabrica_ref }}
          path: .fabrica-plugin
          token: ${{ secrets.FABRICA_PLUGIN_TOKEN || github.token }}
          persist-credentials: false

      - name: Saca el plugin del proyecto y pone sus comandos en el PATH
        run: |
          mv .fabrica-plugin "$RUNNER_TEMP/fabrica-plugin"
          echo "FABRICA=$RUNNER_TEMP/fabrica-plugin/plugins/fabrica" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/fabrica-plugin/plugins/fabrica/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # pnpm, si el package.json lo pide en packageManager. Corepack viene
      # con Node 24 y baja esa versión exacta.
      - name: Activa pnpm si el proyecto lo usa
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          if jq -e '(.packageManager // "") | startswith("pnpm@")' package.json >/dev/null 2>&1; then
            corepack enable
            echo "pnpm $(pnpm --version), el de packageManager en package.json"
          fi

      - name: Dependencias del proyecto
        if: hashFiles('factory.json') != ''
        run: fabrica-cmd install

      - name: Instala el navegador para los tests de UI
        if: hashFiles('factory.json') != '' && hashFiles('playwright.config.*') != ''
        run: npx playwright install --with-deps chromium

      # El mismo lector que process-backlog.sh: valida el nombre, así que un
      # valor con espacios o saltos de línea no puede agregar argumentos.
      - name: Lee el modelo del worker de factory.json
        run: |
          source "$FABRICA/scripts/lib/factory-config.sh"
          echo "FACTORY_MODEL=$(factory_read_model worker sonnet)" >> "$GITHUB_ENV"
          # La base de la que los hooks leen factory.json, leída del checkout
          # de la rama principal, antes de pasar a la del PR.
          base=$(factory_read_value baseBranch 2>/dev/null)
          [[ "${base:-main}" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "baseBranch inválida en factory.json" >&2; exit 1; }
          echo "FABRICA_BASE=${base:-main}" >> "$GITHUB_ENV"

      # Los plugins que el proyecto suma a la fábrica (factory.json →
      # extraPlugins), leídos antes de que el agente toque nada. Sin la
      # lista, la nube cargaba solo fabrica aunque el host tuviera más. Cada
      # marketplace se clona en el commit que fija el proyecto: sus hooks
      # corren con los secretos de este job.
      - name: Lee los plugins extra de factory.json
        id: extra
        run: |
          {
            echo "plugins<<FABRICA_EOF"
            bash "$FABRICA/scripts/extra-plugins.sh" plugins
            echo "FABRICA_EOF"
            echo "marketplaces<<FABRICA_EOF"
            bash "$FABRICA/scripts/extra-plugins.sh" clone "$RUNNER_TEMP/extra-marketplaces"
            echo "FABRICA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolver credencial del actor
        id: cred
        shell: bash
        env:
          # Todos los secretos que el proyecto pasó con `secrets: inherit`.
          # Este paso solo saca de ahí el que corresponde; no corre código de
          # terceros.
          SECRETS_JSON: ${{ toJSON(secrets) }}
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          # En un re-run, GITHUB_ACTOR sigue siendo quien disparó la corrida:
          # con otra persona re-ejecutándola, se gastaría el token ajeno.
          if [ "${GITHUB_TRIGGERING_ACTOR:-$GITHUB_ACTOR}" != "$GITHUB_ACTOR" ]; then
            echo "::error title=Re-ejecución de otra persona::$GITHUB_TRIGGERING_ACTOR re-ejecutó una corrida de $GITHUB_ACTOR. Para no usar el token de $GITHUB_ACTOR, vuelve a dispararla tú (la etiqueta o la mención)."
            exit 1
          fi
          pick() { jq -r --arg k "$1" '.[$k] // empty' <<< "$SECRETS_JSON"; }
          DEFAULT_API=$(pick ANTHROPIC_API_KEY)
          A="${GITHUB_ACTOR^^}"; A="${A//[^A-Z0-9]/_}"; KEY="CLAUDE_TOKEN_$A"
          TOKEN=$(pick "$KEY")
          if [ -n "$TOKEN" ]; then
            echo "🔑 Credencial: $KEY (token personal de $GITHUB_ACTOR)"
            { echo "oauth=$TOKEN"; echo "api="; } >> "$GITHUB_OUTPUT"
          elif [ -n "$DEFAULT_API" ]; then
            echo "🔑 Credencial: ANTHROPIC_API_KEY (API key de equipo)"
            { echo "oauth="; echo "api=$DEFAULT_API"; } >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Sin credencial::$GITHUB_ACTOR no tiene token ($KEY) y el repo no tiene API key de equipo"
            if [ -n "${NUM:-}" ]; then
              BODY=$(printf '🔑 @%s: no encontré credencial tuya para correr la fábrica en la nube, y este repo no tiene API key de equipo.\n\nPlanta tu token personal:\n```\nclaude setup-token\ngh secret set %s --repo %s\n```\n\nLuego repite la mención.' "$GITHUB_ACTOR" "$KEY" "$GITHUB_REPOSITORY")
              gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY" || true
            fi
            exit 1
          fi

      # La action niega npm, node, los tests y los intérpretes en un PR cuyo
      # autor no tiene escritura, y un bot nunca la tiene: en los PRs de la
      # fábrica, Claude no podía correr lo que el Stop gate sí corre. Solo se
      # apaga si el PR lo abrió claude[bot] desde una rama de este repo.
      #
      # La action repone .claude/ desde la base, pero no factory.json: los
      # hooks de la fábrica correrían lo que nombra la rama del PR, con las
      # credenciales del job. En un PR que no es de claude[bot] desde este
      # repo ni de una persona con escritura, el gate y el lint no corren.
      - name: ¿El PR es de la fábrica?
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
        run: |
          restrict=true
          hooks=
          if [ -n "$PR_NUMBER" ]; then
            hooks=off
            if info=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
                 -q '"\(.user.login) \(.user.type) \(.head.repo.full_name)"'); then
              read -r login type _ <<<"$info"
              if [ "$info" = "claude[bot] Bot $GITHUB_REPOSITORY" ]; then
                restrict=false
                hooks=
                echo "PR #$PR_NUMBER de la fábrica: Claude puede correr los tests"
              elif [ "$type" = User ] \
                && perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$login/permission" -q .permission) \
                && { [ "$perm" = admin ] || [ "$perm" = write ]; }; then
                hooks=
              fi
            fi
            [ -z "$hooks" ] || echo "PR #$PR_NUMBER de alguien sin escritura: el gate y el lint de la fábrica no corren"
          fi
          { echo "restrict=$restrict"; echo "hooks=$hooks"; } >> "$GITHUB_OUTPUT"

      # En un PR, la action trae su rama antes de poner el token de la App, y
      # sin la credencial del checkout ese fetch fallaba (fabrica-prueba #43).
      # Como extraheader en .git/config, la action la quita antes de que corra
      # Claude, así que los pushes siguen saliendo con la App.
      - name: Credencial de lectura para que la action traiga la rama del PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$HEADER"
          git config --local http.${GITHUB_SERVER_URL}/.extraheader "$HEADER"

      - name: Run Claude on the mention
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        env:
          # Los subagentes en primer plano: en segundo plano, el agente lanza al
          # revisor, termina su turno esperando la notificación y la sesión se
          # cierra sin la respuesta (probado el 2026-11-16).
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          # El Stop gate queda prendido: si la mención solo responde, ve que la
          # sesión no cambió nada y no verifica; si commitea código, lo
          # verifica como a cualquier worker. Se apaga, con el lint, en un PR
          # de alguien sin escritura (paso trust).
          FACTORY_GATE: ${{ steps.trust.outputs.hooks }}
          FACTORY_LINT: ${{ steps.trust.outputs.hooks }}
          # Como un worker: los hooks leen factory.json de la base y el
          # worker-guard no deja mergear ni empujar a la base.
          FABRICA_WORKER: "1"
          FABRICA_BASE: ${{ env.FABRICA_BASE }}
        with:
          claude_code_oauth_token: ${{ steps.cred.outputs.oauth }}
          anthropic_api_key: ${{ steps.cred.outputs.api }}
          plugin_marketplaces: |
            ${{ runner.temp }}/fabrica-plugin
            ${{ steps.extra.outputs.marketplaces }}
          plugins: |
            fabrica@fabrica-local
            ${{ steps.extra.outputs.plugins }}
          restrict_untrusted_prs: ${{ steps.trust.outputs.restrict }}
          claude_args: "--max-turns 50 --model ${{ env.FACTORY_MODEL }}"
          # Sin prompt: la Action lee la mención y responde en el hilo.
