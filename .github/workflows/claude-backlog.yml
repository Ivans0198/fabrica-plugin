# Reusable workflow: la fábrica en la nube. El proyecto lo llama desde
# .github/workflows/claude-backlog.yml cuando un issue recibe la etiqueta
# `ready-for-dev`: Claude implementa esa issue, una por corrida.
#
# Credenciales (el proyecto pasa sus secretos con `secrets: inherit`):
# CLAUDE_TOKEN_<SU_USUARIO> de quien puso la etiqueta, o ANTHROPIC_API_KEY.
# El token de cada persona se busca por nombre: no hay mapa que mantener.
# Requiere además la GitHub App de Claude instalada (github.com/apps/claude).
name: claude-backlog

on:
  workflow_call:
    inputs:
      fabrica_repo:
        required: true
        type: string
      fabrica_ref:
        required: true
        type: string

jobs:
  implement:
    # Solo con ready-for-dev. Una llamada vieja con los disparos que ya no
    # existen (el turno nocturno, a mano) no corre nada.
    if: github.event_name == 'issues' && github.event.label.name == 'ready-for-dev'
    runs-on: ubuntu-latest
    # Por debajo del tope de 6h de GitHub.
    timeout-minutes: 120
    concurrency:
      group: claude-backlog-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trae el plugin fabrica
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.fabrica_repo }}
          ref: ${{ inputs.fabrica_ref }}
          path: .fabrica-plugin
          token: ${{ secrets.FABRICA_PLUGIN_TOKEN || github.token }}
          persist-credentials: false

      - name: Saca el plugin del proyecto y pone sus comandos en el PATH
        run: |
          mv .fabrica-plugin "$RUNNER_TEMP/fabrica-plugin"
          echo "FABRICA=$RUNNER_TEMP/fabrica-plugin/plugins/fabrica" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/fabrica-plugin/plugins/fabrica/bin" >> "$GITHUB_PATH"

      # La etiqueta sola no alcanza: una issue bloqueada o asignada a otra
      # persona no se toma. Va antes de instalar nada, para no gastar minutos.
      - name: Revisa que la issue se pueda tomar
        id: gate
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          rc=0
          why=$(fabrica-eligible "$NUM" --actor "$GITHUB_ACTOR" 2>&1) || rc=$?
          [ "$rc" -eq 0 ] && exit 0
          if [ "$rc" -ne 2 ] && [ "$rc" -ne 3 ]; then echo "$why" >&2; exit "$rc"; fi
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=No se toma #$NUM::$why"
          gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --remove-label ready-for-dev || true
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "🤖 **La nube no tomó esta issue.** $why Cuando se pueda, vuelve a poner la etiqueta \`ready-for-dev\`." || true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 24
          package-manager-cache: false

      - name: Dependencias del proyecto
        if: steps.gate.outputs.skip != 'true'
        run: fabrica-cmd install

      - name: Instala el navegador para los tests de UI
        if: steps.gate.outputs.skip != 'true' && (hashFiles('playwright.config.*') != '')
        run: npx playwright install --with-deps chromium

      # El mismo lector que process-backlog.sh: valida el nombre, así que un
      # valor con espacios o saltos de línea no puede agregar argumentos.
      - name: Lee el modelo del worker de factory.json
        if: steps.gate.outputs.skip != 'true'
        run: |
          source "$FABRICA/scripts/lib/factory-config.sh"
          echo "FACTORY_MODEL=$(factory_read_model worker sonnet)" >> "$GITHUB_ENV"

      # El mismo archivo que lee el worker local, para que la nube y la
      # máquina no se separen.
      - name: Lee las herramientas prohibidas al worker
        if: steps.gate.outputs.skip != 'true'
        run: |
          tools=$(grep -v '^[[:space:]]*#' "$FABRICA/scripts/worker-disallowed-tools.txt" \
            | grep -v '^[[:space:]]*$' | tr -d ' \t' | tr '\n' ',' | sed 's/,$//')
          echo "WORKER_DISALLOWED_TOOLS=$tools" >> "$GITHUB_ENV"

      - name: Resolver credencial del actor
        if: steps.gate.outputs.skip != 'true'
        id: cred
        shell: bash
        env:
          # Todos los secretos que el proyecto pasó con `secrets: inherit`.
          # Este paso solo saca de ahí el que corresponde; no corre código de
          # terceros.
          SECRETS_JSON: ${{ toJSON(secrets) }}
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          pick() { jq -r --arg k "$1" '.[$k] // empty' <<< "$SECRETS_JSON"; }
          DEFAULT_API=$(pick ANTHROPIC_API_KEY)
          A="${GITHUB_ACTOR^^}"; A="${A//[^A-Z0-9]/_}"; KEY="CLAUDE_TOKEN_$A"
          TOKEN=$(pick "$KEY")
          if [ -n "$TOKEN" ]; then
            echo "🔑 Credencial: $KEY (token personal de $GITHUB_ACTOR)"
            { echo "oauth=$TOKEN"; echo "api="; } >> "$GITHUB_OUTPUT"
          elif [ -n "$DEFAULT_API" ]; then
            echo "🔑 Credencial: ANTHROPIC_API_KEY (API key de equipo)"
            { echo "oauth="; echo "api=$DEFAULT_API"; } >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Sin credencial::$GITHUB_ACTOR no tiene token ($KEY) y el repo no tiene API key de equipo"
            if [ -n "${NUM:-}" ]; then
              BODY=$(printf '🔑 @%s: no encontré credencial tuya para correr la fábrica en la nube, y este repo no tiene API key de equipo.\n\nPlanta tu token personal:\n```\nclaude setup-token\ngh secret set %s --repo %s\n```\n\nLuego vuelve a poner la etiqueta ready-for-dev.' "$GITHUB_ACTOR" "$KEY" "$GITHUB_REPOSITORY")
              gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY" || true
            fi
            exit 1
          fi

      # El prompt solo despacha: el ciclo está en las reglas del proyecto, y el
      # texto sale del mismo generador que usan los workers locales.
      - name: Arma el prompt del worker
        if: steps.gate.outputs.skip != 'true'
        id: prompt
        env:
          NUM: ${{ github.event.issue.number }}
        run: |
          text=$(fabrica-worker-prompt one "$NUM")
          {
            echo "text<<FABRICA_PROMPT_EOF"
            echo "$text"
            echo "FABRICA_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code on the issue / backlog
        if: steps.gate.outputs.skip != 'true'
        id: claude
        # Por debajo del tope del job: si el agente se pasa, el paso falla y el
        # aviso de abajo alcanza a correr. Con el job cancelado no corría nada.
        timeout-minutes: 110
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        env:
          # Los subagentes en primer plano: en segundo plano, el agente lanza al
          # revisor, termina su turno esperando la notificación y la sesión se
          # cierra sin la respuesta (probado el 2026-11-16).
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # El runner no tiene el .env.local del proyecto. Si los tests de
          # integración necesitan servicios reales, sus valores van como
          # secretos del repo; este workflow todavía no los exporta.
          claude_code_oauth_token: ${{ steps.cred.outputs.oauth }}
          anthropic_api_key: ${{ steps.cred.outputs.api }}
          # El plugin en la versión que fijó el proyecto, desde la copia local
          # de arriba: con la URL Git la nube instalaría siempre la última.
          plugin_marketplaces: ${{ runner.temp }}/fabrica-plugin
          plugins: fabrica@fabrica-local
          prompt: ${{ steps.prompt.outputs.text }}
          # Un worker que se queda sin turnos a mitad de ticket no alcanza ni a
          # commitear lo que ya tenía verde.
          claude_args: "--max-turns 200 --model ${{ env.FACTORY_MODEL }} --disallowedTools ${{ env.WORKER_DISALLOWED_TOOLS }}"

      # Sin esto no hay forma de ver qué hizo el agente: la Action oculta su
      # salida, también en modo debug. Repos privados: la ven quienes ya
      # tienen acceso al repo.
      - name: Guarda la transcripción del agente
        if: always() && steps.gate.outputs.skip != 'true' && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcripcion-agente-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7
          if-no-files-found: ignore

      # Un job en verde no prueba que haya PR: el agente puede terminar sin
      # abrirlo. Una issue en in-progress sin PR deja de ser elegible para
      # siempre, así que pasa a needs-human con el motivo.
      - name: Marca la issue si el agente terminó sin PR
        if: steps.gate.outputs.skip != 'true' && (success() && github.event_name == 'issues')
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          # Las reglas prohíben el PR cuando el Stop gate se rinde, pero eso es
          # texto: si el agente lo abrió igual, no cuenta como éxito.
          if [ -f .factory/gate-gave-up ]; then
            fabrica-release "$NUM" --needs-human "El Stop gate se rindió después de agotar los ciclos de corrección: lint, tipos o tests siguen en rojo en la rama \`impl-$NUM\`. Si hay un PR, no lo mergees así. La transcripción del agente está en los artefactos de la corrida, en la pestaña Actions."
          else
            fabrica-check-done "$NUM" || fabrica-release "$NUM" --needs-human "La corrida en la nube terminó sin abrir un PR con \`Closes #$NUM\`. La transcripción del agente está en los artefactos de la corrida, en la pestaña Actions."
          fi

      # Con fabrica-release la issue sale de in-progress y de la tarjeta en
      # curso, igual que en local. Si la corrida falló antes de instalar el
      # plugin, no hay fabrica-release: queda la etiqueta y el comentario.
      - name: Deja una nota en el issue si la corrida falló o se canceló
        if: steps.gate.outputs.skip != 'true' && (failure() || cancelled()) && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          msg="La corrida en la nube falló o se pasó del tiempo antes de completar este issue: $run_url. Causas típicas: la GitHub App de Claude sin instalar en el repo (github.com/apps/claude → Install), cuota o créditos agotados, un secreto sin configurar (\`FABRICA_PLUGIN_TOKEN\` si falló al traer el plugin), un error del entorno. Si alcanzó a crearse la rama del PR, el trabajo parcial está ahí. Para reintentar: resuelve la causa y vuelve a poner la etiqueta \`ready-for-dev\` (quítala primero si sigue puesta)."
          if command -v fabrica-release >/dev/null 2>&1; then
            fabrica-release "$NUM" --needs-human "$msg" || true
          else
            gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --add-label needs-human --remove-label in-progress || true
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "🤖 **Necesita a una persona.** $msg" || true
          fi
